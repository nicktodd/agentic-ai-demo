# This is a teaching repo: the open issues are live exercises, so external
# pull requests are closed automatically with a polite note. PRs from the
# repo owner, collaborators and the Copilot coding agent are left alone.
name: Close external pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close PRs from non-collaborators
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            if (pr.user.type === 'Bot' || author.toLowerCase().includes('copilot')) {
              core.info(`Leaving bot PR from ${author} open`);
              return;
            }
            const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner, repo: context.repo.repo, username: author,
            });
            if (['admin', 'maintain', 'write'].includes(perm.permission)) {
              core.info(`${author} has ${perm.permission} access; leaving PR open`);
              return;
            }
            const body = [
              `Thanks for your interest, @${author}.`,
              '',
              'This repository is a teaching demo. The open issues are deliberately left unresolved',
              'so they can be used as live exercises during training sessions, so external pull',
              'requests are not merged here. This PR is being closed automatically; it is nothing',
              'to do with the quality of your work. See the README for details.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body,
            });
            await github.rest.pulls.update({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, state: 'closed',
            });
